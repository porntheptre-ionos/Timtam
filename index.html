  <script>
    const shareButton = document.querySelector("[data-share]");
    const shareLabel = document.querySelector("[data-share-label]");
    const shareData = {
      title: "Timtam the Pet Star",
      text: "Meet Timtam, a glam little pet star with celebrity energy and Papa and Mama contact links.",
      url: "https://timtam.vercel.app/"
    };

    shareButton?.addEventListener("click", async () => {
      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(shareData.url);
          shareLabel.textContent = "Link copied";
          window.setTimeout(() => {
            shareLabel.textContent = "Share Timtam";
          }, 1800);
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          shareLabel.textContent = "Copy failed";
          window.setTimeout(() => {
